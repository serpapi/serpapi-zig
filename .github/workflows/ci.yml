name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Lint (zig fmt --check)
        run: zig build lint
      - name: Build
        run: zig build
      - name: Unit tests
        run: zig build test --summary all
      - name: Integration tests
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: zig build itest --summary all

      - name: Install kcov
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: sudo apt-get update && sudo apt-get install -y kcov

      - name: Code coverage
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          zig build cov
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          report = json.load(open("zig-out/coverage/merged/kcov-merged/coverage.json"))
          print("## Code coverage: %s%%\n" % report["percent_covered"])
          print("| file | covered | total | percent |")
          print("|---|---|---|---|")
          for f in report["files"]:
              print("| %s | %s | %s | %s%% |" % (
                  f["file"].split("/")[-1], f["covered_lines"],
                  f["total_lines"], f["percent_covered"]))
          EOF
