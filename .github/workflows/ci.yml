name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Lint (zig fmt --check)
        run: zig build lint
      - name: Build
        run: zig build
      - name: Unit tests
        run: zig build test --summary all
      - name: Integration tests
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: zig build itest --summary all
      # The demos are standalone projects that depend on this repo by path;
      # building them keeps the downstream wiring examples honest.
      - name: Build demos
        run: |
          zig build --build-file demo/flight_tracker/build.zig
          zig build test --build-file demo/wasm/build.zig --summary all

  # Runs on Linux arm64 inside Debian trixie, which packages kcov 43:
  # - macOS: kcov hung the unit-test binary under ptrace on the hosted
  #   runner until the step timed out, on every run.
  # - Linux x86_64: kcov reports zero instrumented files for Zig's Debug
  #   binaries.
  # - Ubuntu 24.04: no kcov package.
  # kcov disables ASLR with personality(2), which Docker's default seccomp
  # profile rejects (kcov exits 255), hence seccomp=unconfined.
  coverage:
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:trixie
      options: --security-opt seccomp=unconfined
    timeout-minutes: 15
    steps:
      - name: Install kcov
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            kcov python3 git ca-certificates curl xz-utils zstd
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Code coverage
        timeout-minutes: 10
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          zig build cov --summary all
          python3 - <<'EOF'
          import json, os, sys
          minimum = 90.0  # REVIEW Q6
          report = json.load(open("zig-out/coverage/merged/kcov-merged/coverage.json"))
          total = float(report["percent_covered"])
          lines = ["## Code coverage: %.2f%% (minimum %.0f%%)\n" % (total, minimum),
                   "| file | covered | total | percent |", "|---|---|---|---|"]
          for f in report["files"]:
              lines.append("| %s | %s | %s | %s%% |" % (
                  f["file"].split("/")[-1], f["covered_lines"],
                  f["total_lines"], f["percent_covered"]))
          print("\n".join(lines))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n".join(lines) + "\n")
          if not report["files"] or total < minimum:
              sys.exit("coverage %.2f%% is below %.0f%%" % (total, minimum))
          EOF

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: zig-out/coverage/merged/kcov-merged
